<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Account - Uni-Bites</title>
<link rel="stylesheet" href="css/admin-account.css">
<link rel="stylesheet" type="text/css" href="css/main.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Navigation Bar -->
<nav class="nav">
    <div class="nav-logo">
        <img src="images/uni bites logo Transpareent.png" alt="Uni-Bites Logo">
        <span>Uni-Bites</span>
    </div>
    <div class="nav-links">
        <a href="Admin-home.html">Home</a>
        <a class="active" href="admin-account.html">Account</a>
    </div>
</nav>

<main class="account-container">

    <!-- PROFILE CARD -->
    <section class="profile-card">
        <div class="profile-avatar-large">
            <img src="https://avatar.iran.liara.run/public" alt="Avatar" id="profileImg">
        </div>
        <div class="profile-info-large">
            <h2 id="profileName">Loading…</h2>
        </div>
    </section>

    <!-- SIDE BY SIDE INFO + EDIT FORM -->
    <section class="side-section">

        <!-- ADMIN INFO -->
        <div class="account-section info-section">
            <h3>Admin Information</h3>
            <div class="info-row">
                <span>Admin ID</span>
                <span id="infoAdminId">—</span>
            </div>
            <div class="info-row">
                <span>Email</span>
                <span id="infoEmail">—</span>
            </div>
            <div class="info-row">
                <span>Role</span>
                <span>Administrator</span>
            </div>
        </div>

        <!-- EDIT PROFILE -->
        <div class="account-section edit-section">
            <h3>Edit Profile</h3>
            <form id="profileForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="fullName" placeholder="Username">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="admin@unibites.com">
                </div>
                <div class="form-group">
                    <label>Profile Picture</label>
                    <input type="file" id="avatarUpload" accept="image/*">
                </div>
                <button type="submit" class="btn">Save Changes</button>
            </form>
        </div>

    </section>

    <!-- SIGN OUT -->
    <button class="btn logout">Sign Out</button>

    <!-- Footer -->
    <footer class="admin-footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>Emergency</h3>
                <p><i class="fas fa-phone-alt"></i> Admin Hotline: +(60) 3-1234-5678</p>
                <button class="btn-alert" onclick="confirm('Activate emergency lockdown?')">
                    <i class="fas fa-exclamation-triangle"></i> Emergency Lockdown
                </button>
            </div>
            <div class="footer-section">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="Admin-home.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3><i class="fas fa-shield-alt"></i> Uni Bites Admin</h3>
                <p>Secure campus food delivery management system</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 Uni Bites Admin System</p>
        </div>
    </footer>

</main>

<script src="js/admin-account.js"></script>
</body>
</html>
